# Model configuration. `risk_scope` is the single switch that determines whether
# the model is trained as an application-time (pre-decision) model or a
# behavioral (post-origination) model — see configs/features.yaml.
#
# Default is application_risk: this is the model that reflects the real BNPL
# use case (decide whether to grant credit at checkout, before any repayment
# event exists). behavioral_risk is kept as an explicit, separately runnable
# profile — never silently blended into production.

risk_scope: application_risk # application_risk | behavioral_risk

algorithm: xgboost

xgboost_params:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  eval_metric: logloss
  random_state: 42
  # scale_pos_weight is computed at train time from the TRAIN split only
  # (see bnpl_credit_risk.models.trainer.ModelTrainer) — never set here.

calibration:
  enabled: false
  method: sigmoid # sigmoid | isotonic
  cv: 5

cross_validation:
  enabled: true
  n_splits: 5
  shuffle: true
  early_stopping_rounds: 50

benchmark:
  models: [XGBoost, LightGBM, CatBoost]
  selection_metric: ROC-AUC
  comparison_threshold: 0.5
  artifact_subdirectory: benchmarks
  threshold_grid_start: 0.02
  threshold_grid_stop: 1.0
  threshold_grid_step: 0.04
  lightgbm_params:
    n_estimators: 300
    learning_rate: 0.05
    objective: binary
    verbosity: -1
  catboost_params:
    iterations: 300
    learning_rate: 0.05
    loss_function: Logloss
    verbose: false
    allow_writing_files: false
  visualization:
    size: [15, 6]
    top_n_features: 15
    shap_sample_size: 500
    shap_top_n: 12
