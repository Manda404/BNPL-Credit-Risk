# Batch inference configuration.

model_version: latest # "latest" resolves artifacts/models/latest.json, or an explicit run id
require_approved_model: true
input_path: data/processed/test_features.csv

validation:
  strategy: strict # strict | warn | quarantine
  quarantine_output_dir: data/reports

output:
  format: csv
  directory: data/output
  filename: submission.csv
  columns:
    - user_id
    - default_probability
    - predicted_default
    - decision_threshold
    - risk_band
    - model_version
    - scoring_timestamp

# Export détaillé du notebook 06 : scoring, vérité terrain et traçabilité.
submission_columns:
  - user_id
  - default_probability
  - default_risk_class
  - predicted_class
  - predicted_label # alias conservé pour les consommateurs existants
  - true_label
  - prediction_correct
  - decision_threshold
  - risk_band
  - model_version
  - scoring_timestamp

visualization:
  size: [15, 6]
